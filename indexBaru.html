<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
        }

        body{
            background-color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container{
            background-color: white;
            padding: 40px 25px;
            border-radius: 10px;
            width: 100px;
            max-width: 300px;

        }
        h2{
            color : black;
            font-size: 15px;
            margin-bottom:5px ;
        }
        .subtitle{
            color: brown;
            font-size: medium;
            margin-bottom: 20px;
        }
        input{
            width: 100%;
            padding: 10px 12px;
            border: 1px;
            border-radius: 6px; 
            font-size: 14px;
            outline: none;
            transition: all;

        }
        .input-grup{
            margin-bottom: 15px;
            text-align: left;
        }

        label{
            display: block;
            font-size: 15px;
            color: gray;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input:focus{
            background-color: lightcyan;
            border-color: blue;
        }
        .btn-masuk{
            display: block;
            width: 100%;
            padding: 12px;
            background-color: steelblue;
            color: whitesmoke;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size:15px ;
            font-weight: 500;
            margin-top: 24px;
            transition: all;
            cursor: pointer;
        }
        .btn-masuk:hover{
            background-color: black;
            color : white;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
