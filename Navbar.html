<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: aliceblue;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: darkmidnightblue;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 20px 40px;
            z-index: 1000; 
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px; 
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: steelblue; 
            color: white;
        }

        .home-section {
            position: relative; 
            height: 100vh;
            width: 100%;
            overflow: hidden; 
            display: flex;
            justify-content: center; 
            align-items: center;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            filter: brightness(30%);
        }
        .home-title {
            position: absolute;
            color: white;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }

        .home-title span {
            color: deepskyblue;
            font-size: 40px; 
            border-bottom: 2px solid deepskyblue; 
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">PC PARTS STORE</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>   
<section id="home" class="home-section">
    
        <img class="bg-image" src="LOL.png" alt="Background PC">
        
        <h1 class="home-title">Upgrade PC LO, Maksimalin Hasrat LO <span>Performa.</span></h1> 
        
    </section>

</body>
</html>
